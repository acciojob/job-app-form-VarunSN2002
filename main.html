<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<form method="post">
		<label for="name">Name:<sup>*</sup></label>
		<input type="text" id="name" placeholder="Name" required>
        <br>
		<label for="email">Email:<sup>*</sup></label>
		<input type="email" id="email" placeholder="Email" required>
		<br>
		<label>Gender:<sup>*</sup> </label>
		<label for="male">Male</label>
		<input type="radio" id="male" name="gender" required>
		<label for="female">Female</label>
		<input type="radio" id="female" name="gender" required>
		<br>
		<label for="laptop">Laptop Brands:</label>
		<select id="laptop">
			<option value="">Select from option below</option>
			<option value="Apple">Apple</option>
			<option value="Asus">Asus</option>
			<option value="HP">HP</option>
		</select>
		<br>
		<label for="age">Age:<sup>*</sup></label>
		<input type="number" id="age" placeholder="Age" required>
		<br>
		<label for="dob">Date of Birth:<sup>*</sup></label>
		<input type="date" id="dob" required>
		<br>
		<label for="password">Password:<sup>*</sup></label>
		<input type="password" id="password" required>
		<br>
		<label for="portfolio">Portfolio URL:</label>
		<input type="url" id="portfolio" placeholder="Portfolio URL">
		<br>
		<button type="submit">Submit</button>
	</form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
